<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf product detection · what the score covers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-rule:    rgba(45,49,66,0.12);
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-card:    #ffffff;
      --color-card-stroke: rgba(45,49,66,0.22);
      --color-input:   #ececec;
      --color-input-stroke: rgba(45,49,66,0.34);
      --color-on-accent: #2d3142;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    /* Diagram type */
    .bg        { fill: var(--color-paper); }
    .headline  { font-family: var(--font-serif); font-size: 40px; fill: var(--color-ink); letter-spacing: -0.02em; }
    .numeral   { font-family: var(--font-serif); font-size: 28px; fill: var(--color-ink); }
    .name      { font-family: var(--font-sans);  font-size: 16px; font-weight: 600; fill: var(--color-ink); }
    .sub       { font-family: var(--font-mono);  font-size: 12px; fill: var(--color-muted); }
    .tag       { font-family: var(--font-mono);  font-size: 10px; font-weight: 500; letter-spacing: 0.16em; fill: var(--color-ink); }
    .tag-soft  { fill: var(--color-muted); }
    .aside     { font-family: var(--font-serif); font-size: 18px; font-style: italic; fill: var(--color-muted); }
    .key       { font-family: var(--font-sans);  font-size: 12px; fill: var(--color-muted); }
    .accent-text { fill: var(--color-accent); }

    /* Class grid, one square per class */
    .sq-scored           { fill: var(--color-ink); }
    .sq-scored-untrained { fill: none; stroke: var(--color-ink); stroke-width: 2; }
    .sq-trained-only     { fill: var(--color-muted); fill-opacity: 0.3; }
    .sq-synthetic-only   { fill: none; stroke: var(--color-soft); stroke-width: 1; }
    .sq-no-boxes         { fill: none; stroke: var(--color-soft); stroke-width: 1; stroke-dasharray: 2 2; }
    .span-scored   { stroke: var(--color-accent); stroke-width: 1.5; }
    .span-unscored { stroke: var(--color-soft); stroke-width: 1; }
    .rule          { stroke: var(--color-rule); stroke-width: 1; }

    /* Cards */
    .card      { fill: var(--color-card); stroke: var(--color-card-stroke); stroke-width: 1; }
    .card-mask { fill: var(--color-paper); }
    .k         { font-family: var(--font-mono); font-size: 12px; fill: var(--color-soft); }
    .v         { font-family: var(--font-mono); font-size: 12px; font-weight: 500; fill: var(--color-ink); }
    .hint      { font-family: var(--font-mono); font-size: 12px; fill: var(--color-soft); }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

    <h1>What the score covers</h1>

        <title id="score-coverage-title">What the validation score covers, class by class</title>
        <desc id="score-coverage-desc">A grid of 369 squares, one per product class. About 237 classes have at least one box in the 300 validation photos and are scored, and 10 of those never appear in a real training photo. The rest are not scored: 45 appear only in real training photos, about 70 only on synthetic renders, and 17 have no boxes at all. Three further limits apply. Many classes have only 1 or 2 validation boxes, so their AP is noisy. 94 of the 4,097 validation boxes are exact duplicates, which pycocotools keeps and Ultralytics drops. The reported pycocotools mAP at 0.5 for run A2 is 0.455 while Ultralytics prints 0.4987 for the same run. The score is local and is not a leaderboard score.</desc>
