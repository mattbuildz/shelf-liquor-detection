<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelf product detection · where the error is</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #7a8399;
      --color-rule:    rgba(45,49,66,0.12);
      --color-accent:  #eb6c36;
      --color-accent-tint: rgba(235,108,54,0.08);
      --color-card:    #ffffff;
      --color-card-stroke: rgba(45,49,66,0.22);
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: var(--font-serif); font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }

    svg { width: 100%; min-width: 960px; display: block; }

    /* Type */
    .bg        { fill: var(--color-paper); }
    .eyebrow-t { font-family: var(--font-mono);  font-size: 11px; font-weight: 500; letter-spacing: 0.14em; fill: var(--color-muted); }
    .headline  { font-family: var(--font-serif); font-size: 46px; fill: var(--color-ink); letter-spacing: -0.02em; }
    .title     { font-family: var(--font-sans);  font-size: 16px; font-weight: 600; fill: var(--color-ink); }
    .name      { font-family: var(--font-sans);  font-size: 14px; font-weight: 600; fill: var(--color-ink); }
    .body      { font-family: var(--font-sans);  font-size: 13px; fill: var(--color-muted); }
    .metric    { font-family: var(--font-mono);  font-size: 12px; fill: var(--color-muted); }
    .value     { font-family: var(--font-mono);  font-size: 13px; font-weight: 600; fill: var(--color-ink); text-anchor: end; }
    .px        { font-family: var(--font-mono);  font-size: 13px; font-weight: 600; fill: var(--color-ink); text-anchor: middle; }
    .tag       { font-family: var(--font-mono);  font-size: 10px; font-weight: 500; letter-spacing: 0.16em; fill: var(--color-muted); }
    .tag-mid   { text-anchor: middle; }
    .tag-soft  { fill: var(--color-soft); }
    .accent-text { fill: var(--color-accent); }

    /* Status chips */
    .chip-seen   { fill: none; stroke: var(--color-ink); stroke-width: 1; }
    .chip-guess  { fill: none; stroke: var(--color-soft); stroke-width: 1; stroke-dasharray: 3 2; }
    .chip-t      { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; }
    .on-seen     { fill: var(--color-ink); }
    .on-guess    { fill: var(--color-muted); }

    /* Bars on a 0 to 1 scale, 400 px wide */
    .track     { fill: var(--color-paper-2); }
    .bar       { fill: var(--color-ink); }

    /* Pixel bottles */
    .px-body   { fill: var(--color-ink); }
    .px-label  { fill: var(--color-accent); }
    .px-grid   { fill: none; stroke: var(--color-paper); stroke-width: 0.6; }
    .ruler     { fill: none; stroke: var(--color-soft); stroke-width: 1; }

    /* Chain */
    .step-seen  { fill: var(--color-card); stroke: var(--color-ink); stroke-width: 1; }
    .step-guess { fill: none; stroke: var(--color-soft); stroke-width: 1; stroke-dasharray: 4 3; }
    .step-plan  { fill: var(--color-accent-tint); stroke: var(--color-accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .flow       { stroke: var(--color-muted); stroke-width: 1.2; fill: none; }
    .head       { fill: var(--color-muted); }
    .rule       { stroke: var(--color-rule); stroke-width: 1; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

    <h1>Where the remaining error comes from</h1>

      <svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="error-anatomy-title error-anatomy-desc">
        <title id="error-anatomy-title">Where the remaining error of run A2 comes from</title>
        <desc id="error-anatomy-desc">Measured on run A2: AP at IoU 0.5 is 0.455 and AP at IoU 0.75 is 0.422, so a much stricter box test barely lowers the score and boxes are placed well. Precision is 0.63 and recall is 0.46, so about half of the labelled products are missed. In run A the box loss was flat by epoch 15 while the class loss was still falling at epoch 50. Hypothesis: at image size 640 a bottle is only about 24 pixels wide, too few to read a label, and at 960 it is about 36 pixels. The planned test is run A3 at image size 960 on a Kaggle T4.</desc>
        <defs>
          <marker id="error-anatomy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>

        <text class="headline" x="40" y="104">The boxes land well. The class is the hard part.</text>

        <!-- Left: what was measured -->

        <text class="chip-t on-seen" x="48" y="149">MEASURED</text>

        <text class="metric" x="40" y="214">AP at IoU 0.5</text>

        <rect class="track" x="40" y="222" width="400" height="14"/>

        <text class="metric" x="40" y="258">AP at IoU 0.75</text>

        <text class="body" x="40" y="302">A much tighter box test barely moves the score.</text>

        <text class="metric" x="40" y="372">precision</text>

        <rect class="track" x="40" y="424" width="400" height="14"/>
        <rect class="bar" x="40" y="424" width="184" height="14" data-run="recall"/>
        <text class="body" x="40" y="460">It misses about half of the labelled products.</text>

        <text class="body" x="40" y="528">In run A the box loss was flat by epoch 15.</text>
